services:
  web:
    build:
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    volumes:
      - ./:/app  # Live code reload
    command: python manage.py runserver 0.0.0.0:8000

  db:
    env_file:
      - .env.dev.db
    environment:
      POSTGRES_PASSWORD: devpassword