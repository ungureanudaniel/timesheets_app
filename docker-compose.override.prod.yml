services:
  web:
    build:
      dockerfile: Dockerfile.prod
    env_file:
      - .env.prod
    ports:
      - "${DOCKER_WEB_PORT:-8000}:8000"  # Configurable port
    volumes:
      - /srv/nginx-ssl/yourdomain.crt:/etc/nginx/certs/yourdomain.crt:ro
      - /srv/nginx-ssl/yourdomain.key:/etc/nginx/certs/yourdomain.key:ro
    command: >
      gunicorn timesheets_main.wsgi:application
      --bind 0.0.0.0:8000
      --workers $${GUNICORN_WORKERS:-4}  # Fallback to 4 workers
      --threads $${GUNICORN_THREADS:-2}  # Fallback to 2 threads
      --timeout 30
      --max-requests 1000
      --max-requests-jitter 50
      --worker-class gthread
      --access-logfile -
      --error-logfile -
      --log-level info
    deploy:
      resources:
        limits:
          cpus: '2'  # CPU limits
          memory: 2G  # Memory limits

